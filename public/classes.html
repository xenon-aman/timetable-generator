<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Classes - Timetable Generator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <a href="subjects.html">Subjects</a>
        <a href="teachers.html">Teachers</a>
        <a href="rooms.html">Rooms</a>
        <a href="classes.html">Classes</a>
        <div class="spacer"></div>
        <button onclick="logout()">Logout</button>
    </nav>

    <main>
        <h1>Classes</h1>

        <div class="form-box">
            <input type="text" id="name" placeholder="Class name">
            <input type="number" id="strength" placeholder="Strength" style="width:100px;">
            <button onclick="createClass()">Add Class</button>
        </div>

        <table>
            <thead><tr><th>Name</th><th>Strength</th><th>Actions</th></tr></thead>
            <tbody id="rows"></tbody>
        </table>
    </main>

    <script src="js/api.js"></script>
    <script>
        requireLogin();

        async function load() {
            const items = await apiFetch("/api/v1/classes");
            const rows = document.getElementById("rows");
            rows.innerHTML = "";
            items.forEach(c => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${c.name}</td>
                    <td>${c.strength}</td>
                    <td class="actions">
                        <button class="edit" onclick="editItem(${c.id}, '${c.name}', ${c.strength})">Edit</button>
                        <button class="delete" onclick="deleteItem(${c.id})">Delete</button>
                    </td>
                `;
                rows.appendChild(tr);
            });
        }

        async function createClass() {
            const name = document.getElementById("name").value.trim();
            const strength = parseInt(document.getElementById("strength").value) || 0;
            if (!name) return alert("Please enter a class name");

            await apiFetch("/api/v1/classes", {
                method: "POST",
                body: JSON.stringify({ name, strength })
            });
            document.getElementById("name").value = "";
            document.getElementById("strength").value = "";
            load();
        }

        async function editItem(id, currentName, currentStrength) {
            const name = prompt("Class name:", currentName);
            if (name === null) return;
            const strength = parseInt(prompt("Strength:", currentStrength)) || currentStrength;

            await apiFetch(`/api/v1/classes/${id}`, {
                method: "PUT",
                body: JSON.stringify({ name, strength })
            });
            load();
        }

        async function deleteItem(id) {
            if (!confirm("Delete this class?")) return;
            try {
                await apiFetch(`/api/v1/classes/${id}`, { method: "DELETE" });
                load();
            } catch (e) {
                alert(e.message);
            }
        }

        load();
    </script>
</body>
</html>
